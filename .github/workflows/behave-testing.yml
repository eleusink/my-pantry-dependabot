name: Behave BDD Testing

on:
  pull_request:
    paths:
      - 'your-local-code/**'
      - '!your-local-code/.venv/**'
      - '!your-local-code/docs/**'
      - '!your-local-code/static/**'
      - '!your-local-code/**/migrations/**'
      - '!your-local-code/**/__pycache__/**'

jobs:
  test:
    runs-on: ubuntu-latest
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' 

      - name: Install Application and Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r your-local-code/requirements.txt
          pip install behave==1.3.3 behave-django==1.9.0 beautifulsoup4==4.14.3 splinter==0.21.0 selenium==4.18.1 webdriver-manager==4.0.1
          pip install responses==0.26.0

      - name: Run Behave BDD Tests
        env:
          DJANGO_SECRET_KEY: dummy_secret_key_for_testing
          DEBUG: true
        run: |
          cd your-local-code/
          python manage.py behave
