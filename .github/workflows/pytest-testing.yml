name: Pytest Testing

on:
  pull_request:
    paths:
      - 'your-local-code/**'
      - '!your-local-code/.venv/**'
      - '!your-local-code/docs/**'
      - '!your-local-code/static/**'
      - '!your-local-code/**/migrations/**'
      - '!your-local-code/**/__pycache__/**'

jobs:
  test:
    runs-on: ubuntu-latest
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' 

      - name: Install Application and Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r your-local-code/requirements.txt
          pip install pytest pytest-django pytest-cov

      - name: Run Pytest
        env:
          SECRET_KEY: dummy_secret_key_for_testing
          DEBUG: true
        run: |
          cd your-local-code/
          pytest
