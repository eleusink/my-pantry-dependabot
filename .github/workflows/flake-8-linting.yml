name: Flake8 Linting

on:
  pull_request:
    paths:
      # NOTE: GitHub Actions does not support variables in the 'on' block. 
      # You must manually update these paths when moving to a new repository.
      - 'your-local-code/**'
      - '!your-local-code/.venv/**'
      - '!your-local-code/docs/**'
      - '!your-local-code/static/**'
      - '!your-local-code/**/migrations/**'
      - '!your-local-code/**/__pycache__/**'

jobs:
  flake8:
    runs-on: ubuntu-latest
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' # Update to match your project's version if needed.

      - name: Install Flake8
        run: python -m pip install flake8

      - name: Run Flake8
        run: |
          # The --exclude flag stops Flake8 from scanning migrations, virtual environments, and static files
          flake8 your-local-code/ \
            --exclude=.venv,docs,static,migrations,__pycache__ \
            --count --select=E9,F63,F7,F82 --show-source --statistics
          
          flake8 your-local-code/ \
            --exclude=.venv,docs,static,migrations,__pycache__ \
            --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics