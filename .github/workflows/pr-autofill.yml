# Name shown in the GitHub Actions tab
name: PR Autofill

# Run this workflow when a pull request is opened, reopened, or updated
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

# Allow the workflow to edit PR titles and bodies
permissions:
  pull-requests: write

jobs:
  autofill:
    runs-on: ubuntu-latest

    steps:

      # Checkout the repository so the gh CLI can run in a git repo
      - uses: actions/checkout@v4

      - name: Autofill PR title/body
        env:
          # GitHub token used by gh CLI to edit the PR
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Source branch name (example: 123/add-login-button)
          BRANCH: ${{ github.event.pull_request.head.ref }}

          # Pull request number
          PR_NUMBER: ${{ github.event.pull_request.number }}

        run: |

          # Function to make branch text human readable
          # Example: "add-login-button" -> "add login button"
          prettify() {
            echo "$1" | sed 's/[-_]/ /g' | xargs
          }

          # ------------------------------------------------
          # CASE 1: Issue branch
          # Example branch: 123/add-login-button
          # ------------------------------------------------
          if [[ "$BRANCH" =~ ^([0-9]+)/(.+)$ ]]; then

            # Extract issue number and description
            ISSUE_NUMBER="${BASH_REMATCH[1]}"
            RAW_DESC="${BASH_REMATCH[2]}"

            # Convert description to readable text
            DESC="$(prettify "$RAW_DESC")"

            # Build PR title
            NEW_TITLE="[#$ISSUE_NUMBER] $DESC"

            # Build PR body template
            NEW_BODY="$(printf '## Summary\n%s\n\n## Testing\n-\n\n## Notes\n-\n\nCloses #%s' "$DESC" "$ISSUE_NUMBER")"

          # ------------------------------------------------
          # CASE 2: Hotfix
          # Example: hotfix/prod-timeout-fix
          # ------------------------------------------------
          elif [[ "$BRANCH" =~ ^hotfix/(.+)$ ]]; then

            RAW_DESC="${BASH_REMATCH[1]}"
            DESC="$(prettify "$RAW_DESC")"

            # Auto-title
            NEW_TITLE="[HOTFIX] $DESC"

            NEW_BODY="$(printf '## Summary\n%s\n\n## Why this is urgent\n-\n\n## Validation\n-\n\n## Risk\n-' "$DESC")"

          # ------------------------------------------------
          # CASE 3: Chore
          # Example: chore/update-readme
          # ------------------------------------------------
          elif [[ "$BRANCH" =~ ^chore/(.+)$ ]]; then

            RAW_DESC="${BASH_REMATCH[1]}"
            DESC="$(prettify "$RAW_DESC")"

            # Auto-title
            NEW_TITLE="[CHORE] $DESC"

            NEW_BODY="$(printf '## Summary\n%s\n\n## Testing\n-\n\n## Notes\n-' "$DESC")"

          # ------------------------------------------------
          # If the branch doesn't match expected patterns,
          # the workflow exits and does nothing.
          # ------------------------------------------------
          else
            echo "Branch name did not match expected format: $BRANCH"
            exit 0
          fi

          # Update the pull request with the new title/body
          gh pr edit "$PR_NUMBER" --title "$NEW_TITLE" --body "$NEW_BODY"