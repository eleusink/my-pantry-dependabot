{% extends "base.html" %}
{% block title %}Log In{% endblock %}
{% block content %}
<section class="about-section">
	<div class="container">
		<h1>Log In</h1>

		<form method="post">
			{% csrf_token %}
			{{ form.as_p }}
			<button type="submit">Log In</button>
		</form>
		<p>
			<a href="{% url 'password_reset' %}">Forgot password?</a>
		</p>
		<p>Don't have an account?
			<a href="{% url 'signup' %}">Sign up here</a>
		</p>
	</div>
</section>
{% endblock %}
