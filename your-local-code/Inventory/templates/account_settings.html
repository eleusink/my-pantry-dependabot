{% extends "base.html" %}

{% block title %}Account Settings{% endblock %}

{% block content %}
<section class="about-section">
	<div class="container">
		<h1>Account Settings</h1>

		<form method="post">
			{% csrf_token %}
			{{ form.as_p }}
			<button type="submit">Save Changes</button>
		</form

		<p class="account-link">
			<a href="{% url 'password_change' %}">Change Password</a>
		</p>
{% endblock %}
