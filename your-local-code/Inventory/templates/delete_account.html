{% extends "base.html" %}

{% block title %}Delete Account {% endblock %}

{% block content %}
<section class="about-section">
	<div class="container">
		<h1>Delete Account</h1>
		<p class="delete-warning">
			Are you sure you want to delete your account? This will permently remove your account and all associated pantry data.
		</p>

		<form method="post">
			{% csrf_token %}
			<button type="submit" class="delete-button">>
				Yes, Delete My Account
			</button>
		</form>

		<p class="cancel-link">
			<a href="{% url 'account_settings' %}">Cancel</a>
		</p>
	</div>
</section>
{% endblock %}
